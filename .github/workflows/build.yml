name: Build plug
on:
  push:
    paths:
      - "mermaid.ts"
      - "mermaid.plug.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Commit built plug
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add mermaid.plug.js
          git diff --cached --quiet || git commit -m "Build mermaid.plug.js"
          git push
